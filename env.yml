name: distill
channels:
  - pytorch
  - nvidia
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - git
  # Match PyTorch to the compiled PyG wheels below.
  - pytorch=2.5.*
  - pytorch-cuda=11.8
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.5.0+cu118.html
      - --only-binary=torch-scatter,torch-sparse,torch-cluster
      - torch==2.5.*
      # FAIR-Chem requires NumPy 1.x; the MACE fork requires e3nn 0.4.4.
      - numpy>=1.26,<2
      - e3nn==0.4.4
      - torch-geometric
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - fairchem-core @ git+https://github.com/hyjwpk/MLIP-Distill.git@deps.fairchem#subdirectory=packages/fairchem-core
